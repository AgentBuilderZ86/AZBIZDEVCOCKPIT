[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Le scan de secrets Netlify ne doit pas inspecter le template d'exemple
  # (.env.example ne contient que des placeholders vides).
  SECRETS_SCAN_OMIT_PATHS = ".env.example,README.md"
  # EMBEDDINGS_MODEL (ex. voyage-3) est un nom de modèle public, pas un secret :
  # Next.js l'inclut dans le bundle serveur → faux positif du scan.
  SECRETS_SCAN_OMIT_KEYS = "EMBEDDINGS_MODEL,VOYAGE_EMBED_BATCH_SIZE,VOYAGE_EMBED_BATCH_DELAY_MS"

# Runtime Next.js officiel de Netlify (App Router, API routes, SSR).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Les variables d'environnement (NOTION_TOKEN, NOTION_DB_*, APOLLO_API_KEY,
# ANTHROPIC_API_KEY, CRON_SECRET) se configurent dans Netlify :
# Site settings → Environment variables. Ne pas committer .env.local.

[functions]
  # Bundler esbuild pour les Netlify Functions (dont le cron planifié).
  node_bundler = "esbuild"

# La planification du rafraîchissement (signaux + scores) est définie en code,
# via `export const config = { schedule: ... }` dans
# netlify/functions/scheduled-refresh.mts (Netlify Scheduled Functions).
